version: 2

# Requisito A.6.7. Mantener las dependencias al dia es parte de la superficie de
# ataque de un producto de seguridad: la mayoria de compromisos reales no
# explotan el codigo propio, sino una libreria transitiva desactualizada.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Las actualizaciones menores y de parche se agrupan en un solo PR. Con una
    # veintena de dependencias, un PR por cada bump semanal genera tanto ruido
    # que se fusionan sin mirar — que es peor que no actualizar.
    groups:
      dependencias-menores:
        update-types:
          - minor
          - patch
    # Los cambios de version mayor NO se agrupan: cada uno puede romper algo y
    # merece revisarse por separado.
    labels:
      - dependencias

  # Las propias Actions tambien se fijan por version y tambien se quedan
  # obsoletas. Una action comprometida corre con acceso al repositorio.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - ci
