<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexion — Nortis</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: hsl(218 32% 96%);
        color: hsl(218 34% 13%);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        background: #fff;
        border: 1px solid hsl(218 24% 90%);
        border-radius: 1.5rem;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 12px 32px -16px rgb(15 28 56 / 0.14);
      }
      /* Isotipo real. Se sirve desde /brand/, que el service worker precachea
         junto al resto de la pantalla: un logo roto en la pantalla de sin
         conexion es exactamente lo contrario de lo que hay que transmitir. */
      .mark {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        display: block;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.375rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: hsl(218 12% 42%);
      }
      button {
        margin-top: 1.5rem;
        height: 2.75rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 999px;
        background: hsl(218 53% 26%);
        color: #fff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="mark" src="/brand/isotipo.png" width="56" height="56" alt="Nortis" />
      <h1>Sin conexion</h1>
      <!--
        La consola no muestra datos guardados sin conexion a proposito: la
        telemetria y los incidentes de una organizacion no se dejan en el disco
        del navegador. Se dice explicitamente para que nadie interprete la
        pantalla como "no hay incidentes".
      -->
      <p>
        Nortis no guarda telemetria en el dispositivo, asi que necesita conexion para
        mostrar el estado real de sus equipos. Reintente cuando vuelva la red.
      </p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
